# 血糖记录 —— Nginx 站点配置
#
# 职责分工：
#   - 静态文件（前端构建产物）由 Nginx 直接托管
#   - /api/ 反代到只监听 127.0.0.1 的 Node 同步服务，API 不直接暴露公网
#
# 安装位置：/etc/nginx/conf.d/gms.conf（CentOS/RHEL/openEuler）
#   或 /etc/nginx/sites-available/gms + sites-enabled 软链（Debian/Ubuntu）
# 后端默认端口 8100，与 apps/api 的 GMS_API_PORT 保持一致。

server {
    listen 80;
    listen [::]:80;

    # 先用 IP 访问；有备案域名后把下行换成域名即可
    server_name _;

    root /var/www/gms;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 审计与安全：隐藏版本号
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同步请求都是短请求，超时给短一点，避免连接堆积
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # API 响应绝不能被缓存（前端也依赖 no-store 语义）
        proxy_buffering off;
    }

    # 健康检查不透出到公网
    location = /healthz {
        deny all;
        return 404;
    }

    # 带内容哈希的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口 HTML 不缓存，保证发版后立刻生效（Safari 对 PWA 入口尤其敏感）
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 单页应用：其余路径一律回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
